# Temporary PR-10 helper. Remove this file before merging PR-10.
name: PR-10 rebuild compiled lib (temporary)

on:
  push:
    branches: [fix/worktree-orphan-cleanup-safety]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Commit generated lib to this development branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- lib/
          if git diff --cached --quiet; then
            echo "Generated lib is synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(build): resync lib after worktree safety review"
          git push origin HEAD:fix/worktree-orphan-cleanup-safety
