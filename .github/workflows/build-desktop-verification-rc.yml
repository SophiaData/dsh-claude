# Build from a FIXED reviewed master commit. Temporary verification branch only.
# This workflow does not create a GitHub release, change a tag, push to master,
# publish npm, or execute a profile install.
name: Desktop verification RC package (temporary)

on:
  push:
    branches:
      - packaging/desktop-0.2.4-rc.1-verification

permissions:
  contents: read

jobs:
  package:
    name: Build v0.2.4-rc.1 from audited master
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ce11fd7e6707ce70e847dac10563afb8a7be0c6
          persist-credentials: false
      - name: Show pinned source
        run: |
          test "$(git rev-parse HEAD)" = "5ce11fd7e6707ce70e847dac10563afb8a7be0c6"
          git show -s --format='%H %s'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test, build and verify committed output
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm release:verify
          test -z "$(git status --porcelain --untracked-files=all -- lib/)" || {
            echo "::error::lib differs from reviewed master source"
            exit 1
          }
      - name: Prepare an explicitly NOT-PUBLISHED RC package
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'package.json'
          const manifest = JSON.parse(readFileSync(file, 'utf8'))
          if (manifest.version !== '0.2.3' || manifest.name !== '@sophiadata-ai/dsh-claude') {
            throw new Error('Unexpected source package/version; refusing to re-label')
          }
          const from = '"version": "0.2.3"'
          const content = readFileSync(file, 'utf8')
          if (content.split(from).length !== 2) throw new Error('Manifest version field is ambiguous')
          writeFileSync(file, content.replace(from, '"version": "0.2.4-rc.1"'))
          NODE
          pnpm release:verify
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/package-result.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/package-result.json', 'utf8'))
          if (data.length !== 1 || data[0].name !== '@sophiadata-ai/dsh-claude'
            || data[0].version !== '0.2.4-rc.1'
            || data[0].filename !== 'sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz') {
            throw new Error('RC tarball does not have the expected identity')
          }
          NODE
          sha256sum sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz > sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz.sha256
          cat > BUILD-INFO.txt <<'INFO'
          Package: @sophiadata-ai/dsh-claude@0.2.4-rc.1
          Purpose: Disposable DSH Desktop integration testing ONLY
          Based on master commit: 5ce11fd7e6707ce70e847dac10563afb8a7be0c6
          Build: GitHub Actions / Ubuntu / Node.js 22 / pnpm 11.28.5
          Distribution status: NOT published to npm or GitHub Releases
          Installation: dsh plugin --profile <test-profile> add ./sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz
          Do not substitute this release candidate for the existing v0.2.3 stable tag.
          INFO
          ls -lh sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz
          cat sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz.sha256
      - name: Upload verified test package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-claude-v0.2.4-rc.1-test-package
          path: |
            sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz
            sophiadata-ai-dsh-claude-0.2.4-rc.1.tgz.sha256
            BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
