name: Sync generated lib

on:
  push:
    branches: [master]
  workflow_dispatch:

# This workflow runs trusted default-branch code only. Never use pull_request_target
# to execute PR-provided package scripts with a write-capable token.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-generated-lib
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild and propose generated lib
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck/test/build must pass before any generated files are proposed.
      - run: pnpm check
      - name: Open or update a draft PR for generated output
        # Pinned peter-evans/create-pull-request v7 release commit.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            lib/
          branch: automation/sync-generated-lib
          base: master
          commit-message: 'chore(build): synchronize generated lib'
          title: 'chore(build): synchronize generated lib with source'
          body: |
            Automated rebuild of committed `lib/` from the current `master` source.

            - Generated by GitHub Actions on Ubuntu with Node.js 22 and pnpm 11.28.5.
            - `pnpm check` (typecheck + tests + build) ran before creating this PR.
            - Only `lib/` is committed; runtime sources and configuration are unchanged.
            - Please review the diff and verify relevant DSH Desktop flows before merging.

            This is a draft PR. Nothing is automatically merged or published.
          draft: true
          delete-branch: true
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
